<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos Disponibles</title>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/game.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/auth-menu.css">
    <link rel="stylesheet" href="/css/home.css">

    <script src="/libs/navigo.min.js"></script>

    <script type="module" src="/js/router.js"></script>
</head>

<body>
    <div class="main-wrapper">
        <div id="error-container"></div>
        <div id="auth-menu"></div>
        <!-- Icons can be implemented using an icon library like Font Awesome or custom SVGs -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <div class="nav-container">
            <nav class="nav-menu">
                <a href="/" data-navigo><span class="menu-icon"><i class="fas fa-home"></i></span>Home</a>

                <a href="/games" data-navigo><span class="menu-icon"><i
                            class="fas fa-gamepad"></i></span></span>Games</a>

                <div class="menu-item has-submenu">
                    <span class="menu-icon"><i class="fas fa-user"></i></span><span id="auth-user-name">Authentication</span>
                    <div class="submenu">
                        <!-- Elementos que solo se muestran a usuarios no autenticados -->
                        <a href="/login" data-navigo class="auth-guest-only">Login</a>
                        <a href="/register" data-navigo class="auth-guest-only">Register</a>

                        <!-- Elementos que solo se muestran a usuarios autenticados -->
                        <a href="/profile" data-navigo class="auth-user-only">Profile</a>
                        <div class="separator auth-user-only"></div>
                        <a href="/logout" data-navigo class="auth-user-only">Logout</a>
                    </div>
                </div>

            </nav>
        </div>
        <div class="games-container" id="gamesContainer"></div>
    </div>
</body>

</html>
