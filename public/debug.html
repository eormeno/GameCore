<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Debugger</title>
    <link rel="stylesheet" href="css/debug.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1>Database Debugger</h1>
            <div class="connection-status">
                <span class="status-indicator" id="connectionStatus"></span>
                <span class="status-text">Connecting...</span>
            </div>
        </header>

        <!-- Main content area -->
        <main class="main-content">
            <!-- Left panel: Tables list -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>Tables</h2>
                    <button class="refresh-btn" id="refreshTables" title="Refresh tables">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <polyline points="1 20 1 14 7 14"></polyline>
                            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
                        </svg>
                    </button>
                </div>
                <div class="tables-list" id="tablesList">
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                        <p>Loading tables...</p>
                    </div>
                </div>
            </aside>

            <!-- Right panel: Table content -->
            <section class="content-panel">
                <div class="content-header">
                    <h2 id="tableTitle">Select a table</h2>
                    <div class="table-info" id="tableInfo"></div>
                </div>
                <div class="content-body" id="contentBody">
                    <div class="welcome-message">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="9" y1="9" x2="15" y2="9"></line>
                            <line x1="9" y1="13" x2="15" y2="13"></line>
                            <line x1="9" y1="17" x2="15" y2="17"></line>
                        </svg>
                        <h3>Database Debugger</h3>
                        <p>Select a table from the left panel to view its contents</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Loading table data...</p>
        </div>
    </div>

    <!-- Error modal -->
    <div class="modal-overlay" id="errorModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Error</h3>
                <button class="close-btn" id="closeErrorModal">&times;</button>
            </div>
            <div class="modal-body">
                <p id="errorMessage"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="retryBtn">Retry</button>
                <button class="btn btn-secondary" id="dismissErrorBtn">Dismiss</button>
            </div>
        </div>
    </div>

    <script src="js/debug.js"></script>
</body>
</html>
