<div>
    <h1 class="game-title" style="display: none;"></h1>
    <button class="close-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" width="24" height="24">
            <path fill="currentColor"
                d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" />
        </svg>
    </button>

    <button class="share-btn" aria-label="Share">
        <svg viewBox="0 0 24 24" width="24" height="24">
            <path fill="currentColor"
                d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z" />
        </svg>
    </button>

    <div id="glCanvas" style="width:800px; height:600px; display:none"></div>

    <script type="module">
        const baseUrl = window.location.origin;
        const apiModule = await import(`${baseUrl}/js/services/api.js`);
        const { fetchApi } = apiModule;
        const getRouter = await import(`${baseUrl}/js/router.js`);
        const router = getRouter.getRouter();
        const { GameRenderer } = await import(`${baseUrl}/js/GameRenderer.js`);

        export async function render(container) {
            const { id } = container._partialParams || {};
            const gameRenderer = new GameRenderer();

            await fetchApi(`/api/game-app/${id}/play`, 'GET', null, (stateName, data) => {
                const title = container.querySelector('.game-title');
                const canvasContainer = document.getElementById('glCanvas');

                // set page title
                document.title = data.title;
                if (stateName === "game") {
                    canvasContainer.style.width = `${data.width}px`;
                    canvasContainer.style.height = `${data.height}px`;
                    canvasContainer.style.display = "block";
                    document.querySelector('.share-btn').addEventListener('click', function () {
                        let url = window.location.href + 'play/' + data.invitationCode;
                        let shareText = '¡Mira este juego! ' + url;
                        if (navigator.share) {
                            navigator.share({
                                title: 'Juego Compartido',
                                text: shareText,
                                url: url
                            }).then(() => {
                                console.log('Juego compartido con éxito');
                            }).catch((error) => {
                                console.error('Error al compartir el juego:', error);
                            });
                        } else {
                            // Fallback para navegadores que no soportan la API de compartir
                            alert('Copia este enlace para compartir: ' + url);
                        }
                    });
                    document.querySelector('.close-btn').addEventListener('click', function () {
                        var gamesContainer = document.getElementById('gamesContainer');
                        if (gamesContainer) {
                            gamesContainer.innerHTML = '';
                        }
                        // Detiene el loop del juego
                        if (typeof gameRenderer !== 'undefined' && typeof gameRenderer.stopGameLoop === 'function') {
                            gameRenderer.stopGameLoop();
                        }
                        router.navigate('/games');
                    });
                    gameRenderer.startGame(data);
                    return;
                } else if (stateName === "auth_required") {
                    router.navigate("/login");
                    return;
                } else if (stateName === "game_not_found") {
                    title.style.display = "block";
                    title.textContent = "Game not found";
                    canvasContainer.style.display = "none";
                    return;
                } else if (stateName === "game_play") {
                    const gameContainer = container.querySelector('.game-container');
                    gameContainer.innerHTML = data.html;
                    return;
                }
            })
        }


    </script>
</div>
