<div class="game-slot" data-game-id="" style="display: flex; align-items: center; background: linear-gradient(145deg, #2b2b2b 0%, #222222 100%); border: 1px solid #444; border-radius: 4px; padding: 6px 8px; min-height: 24px; max-height: 24px; transition: all 0.2s ease; cursor: pointer;">
    <!-- Slot Number -->
    <div class="slot-number" data-field="slot" style="min-width: 18px; width: 18px; height: 18px; background: #ff5722; color: white; border-radius: 2px; font-size: 0.7rem; font-weight: bold; display: flex; align-items: center; justify-content: center; margin-right: 6px; flex-shrink: 0;">1</div>
    
    <!-- Game Info -->
    <div class="slot-content" style="flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0;">
        <span class="game-name" data-field="name" style="font-size: 0.8rem; font-weight: 500; color: #f0f0f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px;">Game Name</span>
        <span class="game-code" data-field="invitation_code" style="font-family: 'Courier New', monospace; font-size: 0.7rem; color: #ff5722; background: rgba(255, 87, 34, 0.1); padding: 1px 4px; border-radius: 2px; white-space: nowrap;">🎮 CODE</span>
        <span class="time-ago" data-field="last_played_at_human" style="font-size: 0.7rem; color: #999; white-space: nowrap; min-width: 70px;">hace 2h</span>
        <span class="game-status" data-field="state" style="font-size: 0.65rem; background: linear-gradient(90deg, #ff5722, #e64a19); color: white; padding: 1px 4px; border-radius: 2px; text-transform: uppercase; white-space: nowrap;">ACTIVO</span>
    </div>
    
    <!-- Actions -->
    <div class="slot-actions" style="display: flex; gap: 2px; margin-left: 6px; flex-shrink: 0;">
        <button class="slot-btn continue-btn" data-game-id="" data-invitation-code="" style="width: 20px; height: 20px; background: linear-gradient(90deg, #ff5722, #e64a19); border: none; border-radius: 2px; color: white; font-size: 0.7rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;" title="Continuar">▶</button>
        <button class="slot-btn share-btn" data-invitation-code="" style="width: 20px; height: 20px; background: linear-gradient(90deg, #42678e, #33506e); border: none; border-radius: 2px; color: white; font-size: 0.65rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;" title="Compartir">📤</button>
        <button class="slot-btn delete-btn" data-game-id="" style="width: 20px; height: 20px; background: linear-gradient(90deg, #f44336, #d32f2f); border: none; border-radius: 2px; color: white; font-size: 0.65rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;" title="Eliminar">🗑</button>
    </div>
</div>
