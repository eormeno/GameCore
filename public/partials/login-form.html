<div class="login-container">
    <form id="loginForm" action="api/login" method="POST">
        <div class="form-group">
            <label class="form-label" for="email">E-mail</label>
            <input type="email" id="email" name="email" class="form-input" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" required>
        </div>
        <div class="button-group">
            <button type="submit" class="primary-btn">Sign in</button>
            <button type="button" class="secondary-btn">Sign up</button>
        </div>
    </form>
    <script type="module">
        const baseUrl = window.location.origin;
        const apiModule = await import(`${baseUrl}/js/services/api.js`);
        const { fetchApi } = apiModule;
        // the router is set in the login-container element class name
        const router = document.querySelector('.login-container').router;

        export function render(container) {
            document.getElementById("loginForm").addEventListener("submit", async function (event) {
                event.preventDefault();
                const formValues = Object.fromEntries(new FormData(event.target));

                await fetchApi(event.target.action, event.target.method, JSON.stringify(formValues),
                    (stateName, data) => {
                        if (stateName === "successful_login") {
                            localStorage.setItem('token', data.token);
                            router.navigate("/");
                        }
                    });

            });
        }
    </script>
</div>
